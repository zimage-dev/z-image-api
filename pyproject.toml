[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "z-image-api"
version = "0.1.0"
description = "Python client for the Z Image API — run Tongyi's 6B Z-Image-Turbo text-to-image model through a hosted endpoint"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "zimage-dev"}]
keywords = ["ai api", "synexa", "z image", "z image api", "z image python", "z-image-turbo"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/zimage-dev/z-image-api"
Documentation = "https://zimage-dev.github.io/z-image-api/"
"Hosted model" = "https://synexa.ai/explore/tongyi/z-image-turbo"

[tool.setuptools.packages.find]
include = ["z_image_api*"]
